security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        username_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        login:
            pattern:  ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
        api:
            pattern:   ^/api
            stateless: true
            jwt: ~
        dev:
            pattern: ^/(_(profiler|wdt))/
            security: false
        main:
            pattern: .*
            provider: username_provider
            custom_authenticators:
                - App\Security\SecurityAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret:    "%secret%"
                lifetime:  30000000
                path:      /
                domain:    ~
            logout:
                path: app_logout
                target: login
            lazy: true
            entry_point: App\Security\SecurityAuthenticator
    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    # Rules are evaluated top-down, first match wins.
    # Everything is denied to anonymous users by default (catch-all at the end):
    # only the paths explicitly listed as PUBLIC_ACCESS are reachable without login.
    access_control:
        # --- Public paths ---
        - { path: ^/$, role: PUBLIC_ACCESS }
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/logout$, role: PUBLIC_ACCESS }
        - { path: ^/resetting, role: PUBLIC_ACCESS }
        # Install wizard and first admin registration: additionally guarded by InstallVoter
        # (denied as soon as allow_install = false or a user is logged in)
        - { path: ^/install/, role: PUBLIC_ACCESS }
        - { path: ^/install_requirements, role: PUBLIC_ACCESS }
        - { path: ^/register$, role: PUBLIC_ACCESS }
        # --- API (JWT) ---
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }
        # --- Administration ---
        - { path: ^/admin/, role: ROLE_ADMIN }
        - { path: ^/user_manager, role: ROLE_ADMIN }
        - { path: ^/settings, role: ROLE_ADMIN }
        - { path: ^/managementsmtp, role: ROLE_ADMIN }
        # --- Default: any other path requires an authenticated user ---
        - { path: ^/, role: ROLE_USER }
